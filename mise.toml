# Monorepo root: tasks in subprojects are addressed as //<dir>:<task>,
# for example `mise run //site:build`.
monorepo_root = true

[monorepo]
config_roots = ["site"]

[settings]
experimental = true

[tools]
hk = "1.56.1"
pkl = "0.32.1"
zig = "0.17.0"

[tasks.check]
description = "Run quick offline checks used by pre-commit hooks"
run = "hk check"

[tasks.ci]
description = "Run all checks and SQLite/PostgreSQL integration tests"
run = '''
set -eu
cleanup() {
  docker compose down --volumes --remove-orphans
}
trap cleanup EXIT INT TERM
mise run check
docker compose up --detach --wait postgres
zig build test
zig build test-integration
'''

[tasks.site]
description = "Build the website into site/public/"
depends = ["//site:build"]

[tasks."site:dev"]
description = "Run the website dev server with live reload"
run = "mise run //site:dev"
